# @package _global_
# T1-A — Granularity Test. Hypothesis H-ENC-01.
#
# Comparison: `media`-name embedding (medium string only) vs canonical-ID
# multihot (medium + stressor) derived from
#   data_contract/preprocessing/<artifact_id>/experiment_chemistry.parquet
# per feature_contract.yaml (NOT legacy media_to_multihot).
#
# NOTE on scope: the multihot arm sees stressors that the media-name arm
# structurally cannot. T1-A's measured gap therefore conflates (a) the
# representation effect (decomposed vs coarse) with (b) the chemistry-scope
# effect (medium+stressor vs medium-only). This is deliberate — it measures
# the headline encoder against the strawman baseline. A strict stressor
# ablation that isolates (a) from (b) is REFACTORPLAN §12 (Deferred:
# "T1-A.1: strict stressor ablation").

experiment_id: T1-A_granularity
stage_or_tier: T1

experiment:
  hypothesis: H-ENC-01
  arms:
    - condition_encoder: media_id
    - condition_encoder: multihot_canonical_id
  seeds: [0, 1, 2]
  promotion_rule:
    additive_baseline_gate: required
    primary: [rmse_decrease, mae_decrease]
    secondary: spearman_non_degradation
