# from decomposed extracts (e.g., LB).
# Data: join `representation_mode_per_media.parquet` and
#   `representation_mode_per_canonical.parquet` (includes `stressor` dominant mode).

experiment_id: T1-E_decomposition_mode
stage_or_tier: T1

experiment:
  hypothesis: H-ENC-05
  arms:
    - feature_bundle: chemistry_only
    - feature_bundle: chemistry_plus_mode_flags
  seeds: [0, 1, 2]
  promotion_rule:
    additive_baseline_gate: required
    primary: [rmse_decrease, mae_decrease]
    secondary: lb_overcoupling_diagnostic
