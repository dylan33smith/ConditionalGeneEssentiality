# @package _global_
# T1-B.3 — Controlled head-to-head: pure binary multihot vs log1p-with-concentrations.
#
# Closes the gap left by T1-B, which compared *transforms of* concentration
# (raw vs log1p vs bounded) but never tested "include concentrations at all
# vs presence-only." Per feature_contract.yaml concentration_policy, the raw
# `amount` values are in mixed units (units_1..units_4 NOT consumed in S4);
# this raises a real epistemic concern about whether including them is honest
# representation or unit-confounded noise.
#
# Decision rule (epistemically conservative):
# - If log1p clearly beats binary by RMSE + MAE thresholds → keep log1p
#   (concentrations carry signal that survives the unit mess).
# - Otherwise → revert lock to BINARY (concentrations don't help measurably,
#   safer not to include unit-mixed values that we can't justify to a reviewer).

experiment_id: T1-B.3_binary_vs_log1p
stage_or_tier: T1

experiment:
  hypothesis: H-ENC-02 (concentration-inclusion controlled test)
  parent_experiment: T1-B_numeric_transform
  arms:
    - condition_encoder: multihot_canonical_id
      chemistry_transform: binary
    - condition_encoder: multihot_canonical_id
      chemistry_transform: log1p
  seeds: [0, 1, 2]
  promotion_rule:
    primary: [rmse_decrease, mae_decrease]
    decision_policy: |
      log1p only wins if it clearly beats binary by RMSE and MAE thresholds
      AND bootstrap CIs are disjoint in log1p's favor. Anything else → binary
      wins by epistemic conservatism (unit-mixed concentrations aren't pulling
      their weight; drop them).
