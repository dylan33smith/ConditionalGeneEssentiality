# @package _global_
# T5-D — Adapter Variants. Hypothesis H-EMB-05.
#
# Follow-up to T5-A: probe which design choices matter for the gene-side
# adapter. Tests dimension reduction depth, adapter width, adapter depth,
# and LayerNorm.
#
# (Replaces the original T5-D fine-tuning experiment, which was dropped
# in favor of this cheaper adapter follow-up.)

experiment_id: T5-D_adapter_variants
stage_or_tier: T5

experiment:
  hypothesis: H-EMB-05
  arms:
    - adapter: baseline_1024_512
    - adapter: out_dim_256
    - adapter: hidden_2048
    - adapter: two_hidden_layers
    - adapter: layernorm
  seeds: [0, 1, 2]
  promotion_rule:
    primary: [rmse_decrease, mae_decrease]
    no_regression_vs_t5_a: required
