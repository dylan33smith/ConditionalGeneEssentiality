# @package _global_
# T3-B — Width Sweep. Hypothesis H-CAP-02.
#
# Tests whether wider hidden layers improve performance at the T3-A winning
# depth. Sweeps {128, 256, 512, 1024}. Promotion: best co-primary metrics.
# Depends on T3-A results.

experiment_id: T3-B_width
stage_or_tier: T3

experiment:
  hypothesis: H-CAP-02
  arms:
    - width: 128
    - width: 256
    - width: 512
    - width: 1024
  seeds: [0, 1, 2]
  promotion_rule:
    primary: [rmse_decrease, mae_decrease]
    parsimony: tiebreaker_only
