# @package _global_
# T6-A — Chemical Fingerprints vs Multihot. Hypothesis H-CHEM-01.
#
# Tests structural fingerprints (Morgan, RDKit, MACCS) as alternatives to
# the 425-dim binary multihot chemistry vector. Fingerprints enable
# generalization across structurally similar compounds.

experiment_id: T6-A_fingerprints
stage_or_tier: T6

experiment:
  hypothesis: H-CHEM-01
  arms:
    - chemistry: multihot_425
    - chemistry: morgan_2048
    - chemistry: rdkit_2048
    - chemistry: maccs_167
    - chemistry: morgan_plus_multihot
    - chemistry: maccs_plus_multihot
  seeds: [0, 1, 2]
  promotion_rule:
    primary: [rmse_decrease, mae_decrease]
    no_regression_vs_t5_a: required
