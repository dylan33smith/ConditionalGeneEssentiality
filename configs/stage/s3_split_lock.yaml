# @package _global_
# S3 — Split Protocol Lock. Selects one primary protocol from S1 candidates.

experiment_id: S3_split_lock
stage_or_tier: S3

stage:
  s3:
    candidate_protocols_path: data_contract/splits/candidate_protocols.yaml
    baselines_path: artifacts/baselines/baselines_per_protocol.json
    chemistry_overlap_range: [0.3, 0.8]   # primary must fall in this band
    output_locked_protocol: data_contract/splits/locked_protocol.yaml
    output_diagnostic_protocols: data_contract/splits/diagnostic_protocols.yaml
    enable_homology_diagnostic: false   # set true if S1 triggered H-HOMO-01
