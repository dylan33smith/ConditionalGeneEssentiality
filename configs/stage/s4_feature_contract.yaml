# @package _global_
# S4 — Feature Contract (Option D). Per-experiment chemistry long + metadata wide.

experiment_id: S4_feature_contract
stage_or_tier: S4

stage:
  s4:
    locked_protocol_path: data_contract/splits/locked_protocol.yaml
    experiments_path: data/derived/canonical/v0/experiments.parquet
    components_path: data/media_composition_v4.xlsx
    components_sheet: Media_Components_ML
    representation_mode_mapping_path: data_contract/representation_mode_mapping.yaml
    stressor_resolution_path: data_contract/preprocessing/_review/stressor_to_canonical_id.yaml
    include_in_ml_only: true
    unk_token: <UNK>
    unk_index: 0
    unk_stressor_token: <UNK_STRESSOR>
    missing_token: <MISSING>
    missing_index: 1
    trimming:
      # Chemistry: 0.0 => keep every canonical_id that appears in >=1 train experiment.
      # No prevalence-based replacement in experiment_chemistry.parquet — OOV / rare
      # handling is deferred to T1 encoders (see research_log/notes/T1_option_d_encoding_handoff.md).
      chemistry_prevalence_threshold: 0.0
      metadata_prevalence_threshold: 0.001
    numeric_transforms:
      Amount: log1p
      alternatives: [raw, bounded]
    metadata_fields:
      oxygen: aerobic
      experiment_group: expGroup
      liquid_state: liquid
    numeric_metadata_fields:
      temperature_c: temperature
      pH: pH
      shaking_rpm: shaking
    output_feature_contract: data_contract/feature_contract.yaml
    output_artifact_dir: data_contract/preprocessing
